<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧乡村·惠农通</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>🌾 惠农通</h1>
      <span class="sub-title">智慧乡村服务平台</span>
    </header>
    <main id="page-container">
      <section id="page-home" class="page active">
        <div class="search-bar">
          <input type="text" id="globalSearch" placeholder="搜索政策、农技..." />
          <button onclick="performGlobalSearch()">搜索</button>
        </div>
        <div class="quick-menu">
          <div class="menu-item" onclick="switchTab('policies')">📜 惠农政策</div>
          <div class="menu-item" onclick="switchTab('agriTech')">🌱 农技知识</div>
          <div class="menu-item" onclick="switchTab('notices')">📢 村务通知</div>
          <div class="menu-item" onclick="switchTab('profile')">👤 我的档案</div>
        </div>
        <div class="section-title">📰 最新动态</div>
        <div id="homeFeed" class="feed-list"></div>
      </section>
      <section id="page-policies" class="page">
        <div class="tab-filters" id="policyFilters">
          <span class="filter-item active" data-cat="全部">全部</span>
          <span class="filter-item" data-cat="补贴政策">补贴</span>
          <span class="filter-item" data-cat="土地政策">土地</span>
          <span class="filter-item" data-cat="保险政策">保险</span>
        </div>
        <div id="policyList" class="card-list"></div>
      </section>
      <section id="page-agriTech" class="page">
        <div class="tab-filters" id="techFilters">
          <span class="filter-item active" data-cat="全部">全部</span>
          <span class="filter-item" data-cat="播种时节">播种</span>
          <span class="filter-item" data-cat="病虫害防治">病虫害</span>
          <span class="filter-item" data-cat="田间管理">田间管理</span>
        </div>
        <div id="techList" class="card-list"></div>
      </section>
      <section id="page-notices" class="page">
        <div class="notice-toolbar">
          <button class="btn-primary" onclick="showPublishModal()">➕ 发布通知（村干部）</button>
        </div>
        <div id="noticeList" class="card-list"></div>
      </section>
      <section id="page-profile" class="page">
        <div class="profile-card">
          <h3>🧑‍🌾 种植档案</h3>
          <form id="plantingForm">
            <label>作物类型</label>
            <select id="cropType" required>
              <option value="水稻">水稻</option>
              <option value="玉米">玉米</option>
              <option value="小麦">小麦</option>
              <option value="蔬菜">蔬菜</option>
            </select>
            <label>品种名称</label>
            <input type="text" id="variety" placeholder="例如：湘两优900" />
            <label>播种日期</label>
            <input type="date" id="sowDate" required />
            <button type="submit" class="btn-primary">保存档案</button>
          </form>
          <hr />
          <div class="reminder-section">
            <h4>🤖 AI 农事提醒</h4>
            <button onclick="fetchReminders()" class="btn-secondary">刷新提醒</button>
            <div id="reminderList" class="reminder-items"></div>
          </div>
        </div>
      </section>
    </main>
    <nav class="bottom-nav">
      <span class="nav-item active" data-tab="home">🏠 首页</span>
      <span class="nav-item" data-tab="policies">📜 政策</span>
      <span class="nav-item" data-tab="agriTech">🌱 农技</span>
      <span class="nav-item" data-tab="notices">📢 通知</span>
      <span class="nav-item" data-tab="profile">👤 我的</span>
    </nav>
  </div>
  <div id="publishModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3>发布村务通知</h3>
      <form id="noticeForm">
        <input type="text" id="noticeTitle" placeholder="通知标题" required />
        <textarea id="noticeContent" placeholder="通知内容" rows="4" required></textarea>
        <input type="text" id="noticePublisher" placeholder="发布人（选填）" />
        <button type="submit" class="btn-primary">确认发布</button>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
